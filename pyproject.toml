[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "draw-topopt"
version = "1.0.0"
description = "Density-based topology optimization with a 2D draw-direction (no-undercut) constraint"
readme = "README.md"
authors = [{ name = "Manasa Narisetty" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "mmapy>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["topopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
